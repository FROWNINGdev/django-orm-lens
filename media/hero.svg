<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44b78b"/>
      <stop offset="1" stop-color="#0c4b33"/>
    </linearGradient>
    <linearGradient id="yellow-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg-grad)"/>

  <g opacity="0.06">
    <path d="M 0 100 Q 320 40 640 100 T 1280 100" stroke="#44b78b" stroke-width="1" fill="none"/>
    <path d="M 0 200 Q 320 140 640 200 T 1280 200" stroke="#44b78b" stroke-width="1" fill="none"/>
    <path d="M 0 300 Q 320 240 640 300 T 1280 300" stroke="#44b78b" stroke-width="1" fill="none"/>
    <path d="M 0 400 Q 320 340 640 400 T 1280 400" stroke="#44b78b" stroke-width="1" fill="none"/>
    <path d="M 0 500 Q 320 440 640 500 T 1280 500" stroke="#44b78b" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(70, 90)">
    <circle cx="30" cy="30" r="30" fill="url(#green-grad)"/>
    <g transform="translate(11, 11)" stroke="#0d1117" stroke-width="1.6" fill="none">
      <ellipse cx="14" cy="9" rx="10" ry="3.5" fill="#44b78b"/>
      <path d="M 4 9 v 14 c 0 2.5 4.5 4.5 10 4.5 s 10 -2 10 -4.5 v -14"/>
      <path d="M 4 16 c 0 2.5 4.5 4.5 10 4.5"/>
      <circle cx="24" cy="26" r="6" fill="#ffd166"/>
      <line x1="28.5" y1="30.5" x2="33" y2="35"/>
    </g>
    <text x="80" y="24" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-weight="600" font-size="17" fill="#7ee8b8" letter-spacing="4">DJANGO ORM LENS</text>
    <text x="80" y="52" font-family="Consolas, monospace" font-size="13" fill="#586069">v0.1.0 · MIT · VS Code Extension</text>
  </g>

  <g transform="translate(70, 200)">
    <text x="0" y="0" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-weight="700" font-size="58" fill="#f0f6fc">Your Django schema.</text>
    <text x="0" y="70" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-weight="700" font-size="58" fill="url(#green-grad)">One click away.</text>
    <text x="0" y="130" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="20" fill="#8b949e">Live sidebar tree + Mermaid ER diagram for every</text>
    <text x="0" y="158" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="20" fill="#8b949e"><tspan font-family="Consolas, monospace" fill="#ffd166">models.py</tspan> in your workspace. Zero config.</text>
  </g>

  <g transform="translate(70, 470)" font-family="Consolas, monospace" font-size="15">
    <rect x="-8" y="-24" width="480" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="6" fill="#7ee8b8">$</text>
    <text x="26" y="6" fill="#f0f6fc">code --install-extension</text>
    <text x="26" y="26" fill="#ffd166">  frowningdev.django-orm-lens</text>
  </g>

  <g transform="translate(720, 100)" filter="url(#drop)">
    <rect x="0" y="0" width="490" height="440" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="490" height="34" rx="12" fill="#0d1117"/>
    <circle cx="18" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="17" r="6" fill="#27c93f"/>
    <text x="245" y="21" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#586069" text-anchor="middle">Django ORM Lens</text>

    <rect x="0" y="34" width="52" height="406" fill="#0d1117"/>
    <rect x="14" y="52" width="24" height="24" rx="4" fill="#1f2933"/>
    <g stroke="#7ee8b8" stroke-width="1.5" fill="none" transform="translate(18, 58)">
      <ellipse cx="8" cy="4" rx="7" ry="2"/>
      <path d="M 1 4 v 8 c 0 1.5 3 2.5 7 2.5 s 7 -1 7 -2.5 v -8"/>
      <circle cx="12" cy="12" r="3"/>
      <line x1="14" y1="14" x2="16.5" y2="16.5"/>
    </g>

    <g transform="translate(66, 62)" font-family="-apple-system, Segoe UI, sans-serif" font-size="11">
      <text x="0" y="14" fill="#8b949e" letter-spacing="1">DJANGO ORM LENS</text>
      <text x="380" y="14" fill="#586069" font-size="12">⟳</text>
      <text x="405" y="14" fill="#586069" font-size="12">◈</text>
    </g>

    <g transform="translate(66, 90)" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">
      <text x="0" y="18" fill="#586069">▾</text>
      <text x="16" y="18" fill="#f0f6fc" font-weight="600">blog_app</text>
      <text x="380" y="18" fill="#586069" font-size="10">5 models</text>

      <text x="24" y="42" fill="#586069">▸</text>
      <text x="40" y="42" fill="#f0f6fc">Category</text>
      <text x="380" y="42" fill="#586069" font-size="10">models.Model</text>

      <text x="24" y="66" fill="#586069">▸</text>
      <text x="40" y="66" fill="#f0f6fc">Tag</text>
      <text x="380" y="66" fill="#586069" font-size="10">models.Model</text>

      <text x="24" y="90" fill="#586069">▾</text>
      <text x="40" y="90" fill="#7ee8b8" font-weight="600">Post</text>
      <text x="380" y="90" fill="#586069" font-size="10">models.Model</text>

      <text x="48" y="114" fill="#ffd166" font-family="Consolas, monospace">a</text>
      <text x="64" y="114" fill="#c9d1d9">title</text>
      <text x="330" y="114" fill="#586069" font-size="10">CharField</text>

      <text x="48" y="134" fill="#ffd166" font-family="Consolas, monospace">a</text>
      <text x="64" y="134" fill="#c9d1d9">slug</text>
      <text x="330" y="134" fill="#586069" font-size="10">SlugField</text>

      <text x="48" y="154" fill="#ffd166" font-family="Consolas, monospace">a</text>
      <text x="64" y="154" fill="#c9d1d9">body</text>
      <text x="330" y="154" fill="#586069" font-size="10">TextField</text>

      <text x="48" y="174" fill="#44b78b">→</text>
      <text x="64" y="174" fill="#c9d1d9">author</text>
      <text x="290" y="174" fill="#7ee8b8" font-size="10">ForeignKey → User</text>

      <text x="48" y="194" fill="#44b78b">→</text>
      <text x="64" y="194" fill="#c9d1d9">category</text>
      <text x="270" y="194" fill="#7ee8b8" font-size="10">ForeignKey → Category</text>

      <text x="48" y="214" fill="#f5a623">⇄</text>
      <text x="64" y="214" fill="#c9d1d9">tags</text>
      <text x="290" y="214" fill="#ffd166" font-size="10">ManyToMany → Tag</text>

      <text x="48" y="234" fill="#8b949e">⚙</text>
      <text x="64" y="234" fill="#8b949e">Meta</text>
      <text x="290" y="234" fill="#586069" font-size="10">ordering, indexes</text>

      <text x="24" y="266" fill="#586069">▸</text>
      <text x="40" y="266" fill="#f0f6fc">Comment</text>
      <text x="380" y="266" fill="#586069" font-size="10">models.Model</text>

      <text x="24" y="290" fill="#586069">▸</text>
      <text x="40" y="290" fill="#f0f6fc">Profile</text>
      <text x="380" y="290" fill="#586069" font-size="10">models.Model</text>

      <text x="0" y="322" fill="#586069">▸</text>
      <text x="16" y="322" fill="#f0f6fc" font-weight="600">accounts</text>
      <text x="380" y="322" fill="#586069" font-size="10">3 models</text>

      <text x="0" y="346" fill="#586069">▸</text>
      <text x="16" y="346" fill="#f0f6fc" font-weight="600">orders</text>
      <text x="380" y="346" fill="#586069" font-size="10">8 models</text>
    </g>
  </g>

  <g transform="translate(1230, 20)" opacity="0.5">
    <circle cx="0" cy="0" r="80" fill="url(#green-grad)" filter="url(#glow)"/>
  </g>
  <g transform="translate(50, 620)" opacity="0.3">
    <circle cx="0" cy="0" r="60" fill="url(#yellow-grad)" filter="url(#glow)"/>
  </g>
</svg>
