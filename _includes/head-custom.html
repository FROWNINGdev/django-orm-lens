<!--
  Injected into <head> by the `jekyll-theme-primer` default layout, which
  ends its head block with an include of this filename.

  Do not write that include tag out literally anywhere in this file, not even
  inside an HTML comment: Liquid runs before HTML is parsed, so the tag would
  execute and pull this file into itself. That is a self-recursive include and
  it fails the build with "Liquid Exception: stack level too deep".

  Renders the ```mermaid fences. GitHub renders them natively in the README,
  but GitHub Pages does not — on the published site they came out as a raw
  `<pre><code class="language-mermaid">` dump of erDiagram syntax, directly
  under a line promising "rendered right here". That was the "broken website
  with unrendered Markdown blocks" cited when wsvincent/awesome-django#378
  was declined.

  The social-card tags live in `_config.yml` instead, so jekyll-seo-tag emits
  them inside its own block rather than duplicating og:/twitter: keys here.
  Also points the favicon at the extension icon. Without this the browser
  asks for /favicon.ico at the domain root — outside this project's page
  path — and every visit logs a 404 while the tab shows a blank icon.
-->

<link rel="icon" type="image/png" href="/django-orm-lens/media/icon.png">

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Kramdown emits ```mermaid as <pre><code class="language-mermaid">.
  // Mermaid expects the source as the direct text of an element it owns, so
  // swap each block for a <pre class="mermaid"> holding the decoded source.
  for (const code of document.querySelectorAll('pre > code.language-mermaid')) {
    const host = document.createElement('pre');
    host.className = 'mermaid';
    host.textContent = code.textContent;
    code.parentElement.replaceWith(host);
  }

  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
  await mermaid.run({ querySelector: 'pre.mermaid' });
</script>

<style>
  /* Reserve the hero's box before the bytes arrive, so the text below it does
     not jump once it loads. This cannot live in the README: GitHub strips the
     style attribute from README HTML, and a pixel `height` attribute would
     fight the `width="100%"` that keeps it responsive there. Pages-only is the
     right home for it. */
  img[src$="media/hero.png"] { aspect-ratio: 1280 / 640; height: auto; }
</style>

<script>
  /* The 21 badges are markdown `![](...)`, so no attribute can be attached at
     the source without rewriting them as raw HTML — which would break the
     [![badge](img)](link) wrapping and make the README worse on GitHub, where
     most people actually read it. Setting the attributes here keeps the
     markdown idiomatic and applies the change only to the published page.

     The first image is left eager on purpose: it is the hero, and lazy-loading
     the largest above-the-fold image delays the very paint it should speed up.
     Everything after it sits below the fold on any realistic viewport. */
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('img').forEach((img, i) => {
      if (i === 0) return;
      if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
      if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
    });
  });
</script>
