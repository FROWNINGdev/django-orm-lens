name: Publish extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version_type }} -m "chore: release v%s"
          git push origin HEAD:main --follow-tags

      - name: Package VSIX
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --no-dependencies --out "django-orm-lens-${VERSION}.vsix"
          echo "VSIX_PATH=django-orm-lens-${VERSION}.vsix" >> $GITHUB_ENV
          echo "VERSION=${VERSION}"                       >> $GITHUB_ENV

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "${{ env.VSIX_PATH }}"

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set — skipping Open VSX publish."
            exit 0
          fi
          npx --yes ovsx publish "${{ env.VSIX_PATH }}" --pat "$OVSX_PAT"
        continue-on-error: true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ env.VSIX_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX_PATH }}
          generate_release_notes: true
