name: Publish extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version_type }} -m "chore: release v%s"
          git push origin HEAD:main --follow-tags

      - name: Package VSIX
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --no-dependencies --out "django-orm-lens-${VERSION}.vsix"
          echo "VSIX_PATH=django-orm-lens-${VERSION}.vsix" >> $GITHUB_ENV
          echo "VERSION=${VERSION}"                       >> $GITHUB_ENV

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # The Marketplace accepts an upload and then times out answering often
        # enough that it has to be planned for: v0.10.0 published, the request
        # timed out at 3 minutes, the step failed, and every step after it —
        # Open VSX, the artifact, the GitHub Release — was skipped even though
        # the version was live. A re-run then says "already exists" and fails
        # again, so the pipeline can never finish without a human. Treat that
        # one message as success; everything else still fails the job.
        run: |
          set +e
          out=$(npx --yes @vscode/vsce publish --no-dependencies --packagePath "$VSIX_PATH" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -qi "already exists"; then
              echo "::notice::$VERSION is already on the Marketplace - continuing"
            else
              exit "$rc"
            fi
          fi

      - name: Publish to Open VSX (VSCodium / Cursor / OSS builds)
        # Skips gracefully when OVSX_PAT isn't set — lets the rest of the
        # release pipeline succeed while the maintainer registers the
        # namespace at https://open-vsx.org and adds the token secret.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: |
          set +e
          out=$(npx --yes ovsx publish "$VSIX_PATH" -p "$OVSX_PAT" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -qiE "already exists|already published"; then
              echo "::notice::$VERSION is already on Open VSX - continuing"
            else
              exit "$rc"
            fi
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ env.VSIX_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.VSIX_PATH }}
          generate_release_notes: true
