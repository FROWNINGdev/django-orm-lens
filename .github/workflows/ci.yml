name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        run: npm test
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out django-orm-lens.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: django-orm-lens.vsix

  python-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Explicit pairs instead of a cross product. The Python axis is the one
      # that matters: the parser is built on `ast`, which changes between
      # releases, so every Python in `requires-python` runs, 3.9 through 3.15.
      # The tests never import Django, so the Django axis only checks that the
      # CLI installs next to each supported release. Each pair is one Django
      # supports: 4.2 stops at 3.12, 6.x starts at 3.12, and 3.15 pairs with
      # 6.1, the first release line to support it. 5.0 and 5.1 are past end of
      # life and were dropped from the matrix.
      matrix:
        include:
          - { python-version: "3.9", django-version: "4.2" }
          - { python-version: "3.10", django-version: "4.2" }
          - { python-version: "3.11", django-version: "4.2" }
          - { python-version: "3.11", django-version: "5.2" }
          - { python-version: "3.12", django-version: "4.2" }
          - { python-version: "3.12", django-version: "5.2" }
          - { python-version: "3.12", django-version: "6.0" }
          - { python-version: "3.13", django-version: "5.2" }
          - { python-version: "3.13", django-version: "6.0" }
          - { python-version: "3.13", django-version: "6.1" }
          - { python-version: "3.14", django-version: "5.2" }
          - { python-version: "3.14", django-version: "6.1" }
          - { python-version: "3.15", django-version: "6.1" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI + test extras
        working-directory: cli
        run: |
          pip install -e ".[dev]"
          pip install "Django==${{ matrix.django-version }}.*"
      # The mcp extra is installed on one leg only. `dev` does not pull it, so
      # until now every test that touches the SDK hit its `FastMCP is None`
      # sentinel and skipped — the whole matrix reported green while the
      # bootstrap was never once constructed against a real SDK. That is how
      # mcp 2.0 deleting `mcp.server.fastmcp` reached users instead of a build.
      #
      # One leg rather than all twelve: the SDK path does not vary by Django
      # version, so the other eleven would buy nothing for the install time.
      # 3.12 also means the marker in the extra resolves mcp 2.x, so it is the
      # newer of the two APIs that gets exercised.
      - name: Install the mcp extra (exercises the real SDK bootstrap)
        if: matrix.python-version == '3.12' && matrix.django-version == '5.2'
        working-directory: cli
        run: pip install -e ".[mcp]"
      # No mcp release supports 3.9, so the extra resolves nothing there. It
      # must still install, CLI and all, and the server must explain the
      # floor (exit 3) instead of the resolver rejecting the whole install.
      - name: The mcp extra still installs on 3.9
        if: matrix.python-version == '3.9'
        working-directory: cli
        run: |
          pip install -e ".[mcp]"
          set +e
          django-orm-lens-mcp
          code=$?
          set -e
          test "$code" -eq 3
      - name: Run pytest
        working-directory: cli
        run: python -m pytest -q

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + lint tools
        working-directory: cli
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: cli
        run: python -m ruff check django_orm_lens tests
      - name: mypy
        working-directory: cli
        run: python -m mypy django_orm_lens
