name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:

# OIDC — GitHub mints a short-lived token per run that PyPI verifies through
# its Trusted Publisher config. Removes the long-lived PYPI_API_TOKEN secret
# and its rotation surface. See:
# https://docs.pypi.org/trusted-publishers/
#
# ⚠️  PyPI-side setup required (one-time):
#   1. https://pypi.org/manage/project/django-orm-lens/settings/publishing/
#   2. Add trusted publisher — owner=FROWNINGdev, repo=django-orm-lens,
#      workflow=publish-pypi.yml, environment=pypi
#   3. After it lands, delete the PYPI_API_TOKEN repo secret.
# Until step 1-2 are done, the next tag push fails at the Publish step with
# a 403 from PyPI — safe failure mode, no bad publish.
permissions:
  contents: write   # the Release step below creates the tag's release page
  id-token: write   # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        working-directory: cli
        run: python -m build

      - name: twine check
        working-directory: cli
        run: python -m twine check dist/*

      - name: Publish to PyPI (OIDC trusted publisher)
        # Pin to a full commit SHA (v1.13.0) so a poisoned tag push cannot
        # silently swap the action. Bump manually — Dependabot will notify.
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: cli/dist
          skip-existing: true

      # py-v1.7.0, 1.7.1, 1.8.0 and 1.8.1 all published to every registry and
      # left no GitHub release page behind, because nothing here ever made one.
      # Anyone reading the Releases tab saw py-v1.6.0 as the newest Python
      # version for a week. The notes come from the tag's own CHANGELOG
      # section, so the release page cannot describe something other than what
      # shipped.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          python - "$TAG" <<'PY'
          import os, pathlib, re, sys

          tag = sys.argv[1]                      # py-v1.8.1
          heading = tag.replace("py-v", "py-")   # py-1.8.1
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          starts = [i for i, l in enumerate(lines) if l.startswith("## ")]
          body = ""
          for n, i in enumerate(starts):
              if re.match(rf"## \[{re.escape(heading)}\]", lines[i]):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  body = "\n".join(lines[i + 1:end]).strip()
                  break
          if not body:
              # No section is not a reason to fail the publish - the package is
              # already on PyPI by this point. Ship a stub and say so.
              body = f"See CHANGELOG.md for {heading}."
              print(f"::warning::no CHANGELOG section for {heading}")
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"wrote {len(body)} chars of notes for {tag}")

          # Title the release after its headline change. A page called just
          # "py-v1.9.0" tells a reader nothing the tag did not already say,
          # while every hand-made page carries a subtitle.
          lead = re.search(r"^- \*\*(.+?)\*\*", body, re.M)
          title = tag
          if lead:
              # A release title is plain text on GitHub - backticks would show
              # up as backticks.
              subtitle = " ".join(lead.group(1).replace("`", "").split()).rstrip(".")
              if len(subtitle) > 70:
                  subtitle = subtitle[:67].rstrip() + "..."
              title = f"{tag} - {subtitle}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"title={title}\n")
          print("release title:", title)
          PY
        env:
          TAG: ${{ github.ref_name }}

      - name: Create the GitHub release page
        # Idempotent on purpose: a re-run of a partially failed publish must not
        # fail here just because the page already exists.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists - leaving it alone"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "$TITLE" --notes-file release-notes.md
          fi
        env:
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
