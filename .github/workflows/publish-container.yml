name: Publish container image to GHCR

on:
  push:
    tags:
      - 'py-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'PyPI version to bake into the image (leave empty for latest)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            case "$TAG" in
              py-v*) VER="${TAG#py-v}" ;;
              v*)    VER="" ;;
              *)     VER="" ;;
            esac
          else
            VER="${{ inputs.version }}"
          fi
          echo "PKG_VERSION=${VER}" >> $GITHUB_OUTPUT
          if [ -n "$VER" ]; then
            echo "TAGS=ghcr.io/frowningdev/django-orm-lens:${VER},ghcr.io/frowningdev/django-orm-lens:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=ghcr.io/frowningdev/django-orm-lens:latest" >> $GITHUB_OUTPUT
          fi

      - name: Wait for PyPI to index the version
        # This workflow runs in parallel with publish-pypi.yml, so a fresh
        # tag push often races: GHCR starts before PyPI has indexed the new
        # version and `pip install django-orm-lens==X` errors with
        # "No matching distribution found". Poll the JSON API until the
        # version appears (or give up after ~5 min, in which case Build
        # will fail loudly with the pip error rather than silently baking
        # a stale image).
        if: steps.ver.outputs.PKG_VERSION != ''
        run: |
          VER="${{ steps.ver.outputs.PKG_VERSION }}"
          echo "Waiting for django-orm-lens==$VER to appear on PyPI..."
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/django-orm-lens/${VER}/json" >/dev/null 2>&1; then
              echo "django-orm-lens==$VER is on PyPI (attempt $i)"
              exit 0
            fi
            echo "Not yet indexed (attempt $i/30), sleeping 10s..."
            sleep 10
          done
          echo "PyPI never indexed $VER after 5 minutes — proceeding anyway (Build step will show the pip error)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.TAGS }}
          build-args: |
            PKG_VERSION=${{ steps.ver.outputs.PKG_VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
