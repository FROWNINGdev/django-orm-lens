name: Publish container image to GHCR

on:
  push:
    tags:
      - 'py-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'PyPI version to bake into the image (leave empty for latest)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            case "$TAG" in
              py-v*) VER="${TAG#py-v}" ;;
              v*)    VER="" ;;
              *)     VER="" ;;
            esac
          else
            VER="${{ inputs.version }}"
          fi
          echo "PKG_VERSION=${VER}" >> $GITHUB_OUTPUT
          if [ -n "$VER" ]; then
            echo "TAGS=ghcr.io/${{ github.repository_owner }}/django-orm-lens:${VER},ghcr.io/${{ github.repository_owner }}/django-orm-lens:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=ghcr.io/${{ github.repository_owner }}/django-orm-lens:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.TAGS }}
          build-args: |
            PKG_VERSION=${{ steps.ver.outputs.PKG_VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
