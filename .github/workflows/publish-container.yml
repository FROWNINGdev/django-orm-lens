name: Publish container image to GHCR

on:
  push:
    tags:
      - 'py-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'PyPI version to bake into the image (leave empty for latest)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            case "$TAG" in
              py-v*) VER="${TAG#py-v}" ;;
              v*)    VER="" ;;
              *)     VER="" ;;
            esac
          else
            VER="${{ inputs.version }}"
          fi
          echo "PKG_VERSION=${VER}" >> $GITHUB_OUTPUT
          if [ -n "$VER" ]; then
            echo "TAGS=ghcr.io/frowningdev/django-orm-lens:${VER},ghcr.io/frowningdev/django-orm-lens:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=ghcr.io/frowningdev/django-orm-lens:latest" >> $GITHUB_OUTPUT
          fi

      - name: Wait for PyPI to index the version
        # This workflow runs in parallel with publish-pypi.yml, so a fresh
        # tag push often races: GHCR starts before PyPI has indexed the new
        # version and `pip install django-orm-lens==X` in the Dockerfile
        # errors with "No matching distribution found".
        #
        # Poll the SIMPLE index (pypi.org/simple/*) — this is what pip
        # actually queries during install, and it lives on a DIFFERENT
        # Fastly cache than the JSON metadata endpoint. Historically we
        # polled the JSON endpoint and it said "yes" while pip still saw
        # "no" (observed on py-v1.4.0 on 2026-07-25T18:01Z), so we now
        # match what pip sees. Give up after ~15 min in which case Build
        # will fail loudly with the pip error rather than silently baking
        # a stale image. 5 min proved too tight during py-v1.2.7 — PyPI's
        # CDN occasionally takes longer to propagate a new release.
        if: steps.ver.outputs.PKG_VERSION != ''
        run: |
          VER="${{ steps.ver.outputs.PKG_VERSION }}"
          echo "Waiting for django-orm-lens==$VER on the PyPI simple index..."
          for i in $(seq 1 90); do
            if curl -fsS "https://pypi.org/simple/django-orm-lens/" | grep -q "django_orm_lens-${VER}-\|django-orm-lens-${VER}.tar.gz"; then
              echo "django-orm-lens==$VER is on the simple index (attempt $i)"
              exit 0
            fi
            echo "Not yet on simple index (attempt $i/90), sleeping 10s..."
            sleep 10
          done
          echo "PyPI never indexed $VER after 15 minutes — proceeding anyway (Build step will show the pip error)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.TAGS }}
          build-args: |
            PKG_VERSION=${{ steps.ver.outputs.PKG_VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
