# Smithery deployment manifest for orm-synapse MCP server.
# Docs: https://smithery.ai/docs/build/project-config/smithery.yaml
#
# The server is a Python package published to PyPI as `orm-synapse[mcp]`.
# Smithery runs it via `uvx` so no user-side install / venv is required.

name: "@nam-tong/orm-synapse"
version: "1.13.3"
description: >-
  Django ORM static-analysis MCP. 13 read-only tools that expose Django
  schema, relationships (FK / M2M / O2O, on_delete, related_name),
  migration DAG, missing-index heuristics, and signal graphs. No DB,
  no Django boot, no credentials.
author:
  name: "FROWNINGdev"
  url: "https://github.com/FROWNINGdev"
license: "MIT"
homepage: "https://github.com/nam-tong/orm-synapse"
keywords:
  - django
  - orm
  - static-analysis
  - mcp
  - ai-agent
  - cursor
  - claude
  - vibe-coding
  - ide-tools
  - schema-graph
  - er-diagram
  - migrations
  - n-plus-one

dependencies:
  python: ">=3.10"

startCommand:
  type: stdio
  # A user of the MCP client can point ORM Synapse at any directory.
  # If omitted, the server uses the client's CWD (typical for VS Code /
  # Cursor / Claude Desktop workspaces).
  configSchema:
    type: object
    properties:
      ormSynapseRoot:
        type: string
        description: >-
          Absolute path to the Django project root (the directory that
          contains manage.py / your app packages). If omitted, the MCP
          server falls back to the client's current working directory.
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['--from', 'orm-synapse[mcp]', 'orm-synapse-mcp'],
      env: config.ormSynapseRoot
        ? { DJANGO_ORM_LENS_ROOT: config.ormSynapseRoot }
        : {}
    })
