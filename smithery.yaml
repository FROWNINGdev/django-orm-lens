# Smithery deployment manifest for orm-lens MCP server.
# Docs: https://smithery.ai/docs/build/project-config/smithery.yaml
#
# The server is a Python package published to PyPI as `orm-lens[mcp]`.
# Smithery runs it via `uvx` so no user-side install / venv is required.

name: "@FROWNINGdev/orm-lens"
version: "1.16.0"
description: >-
  Django and SQLAlchemy static-analysis MCP. 13 read-only tools that expose
  the schema, relationships (FK / M2M / O2O, on_delete, related_name), the
  migration DAG, missing-index heuristics, signal graphs and N+1 loops.
  No DB, no app boot, no credentials.
author:
  name: "FROWNINGdev"
  url: "https://github.com/FROWNINGdev"
license: "MIT"
homepage: "https://github.com/FROWNINGdev/orm-lens"
keywords:
  - django
  - orm
  - static-analysis
  - mcp
  - ai-agent
  - cursor
  - claude
  - vibe-coding
  - ide-tools
  - schema-graph
  - er-diagram
  - migrations
  - n-plus-one

dependencies:
  python: ">=3.10"

startCommand:
  type: stdio
  # A user of the MCP client can point ORM Lens at any directory.
  # If omitted, the server uses the client's CWD (typical for VS Code /
  # Cursor / Claude Desktop workspaces).
  configSchema:
    type: object
    properties:
      djangoOrmLensRoot:
        type: string
        description: >-
          Absolute path to the Django project root (the directory that
          contains manage.py / your app packages). If omitted, the MCP
          server falls back to the client's current working directory.
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['--from', 'orm-lens[mcp]', 'orm-lens-mcp'],
      env: config.djangoOrmLensRoot
        ? { ORM_LENS_ROOT: config.djangoOrmLensRoot }
        : {}
    })
