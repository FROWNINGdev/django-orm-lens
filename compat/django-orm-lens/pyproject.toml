# django-orm-lens was renamed to orm-lens in 1.16.0. This distribution keeps
# `pip install django-orm-lens` (and the [mcp] extra) working: it installs the
# matching orm-lens release and adds only what carries the old name - the
# `django-orm-lens` / `django-orm-lens-mcp` commands and the `django_orm_lens`
# import path, both thin aliases of orm-lens.
#
# Those live here and not in orm-lens on purpose. Upgrading from an old
# django-orm-lens uninstalls that release's files (its django_orm_lens/
# package and its two commands) after orm-lens is installed; files of the
# same name owned by orm-lens would be deleted with them.
#
# The version and both pins below move with cli/pyproject.toml on every
# release; cli/tests/test_packaging.py fails CI when they drift.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-orm-lens"
version = "1.16.0"
description = "Renamed to orm-lens: installs orm-lens and keeps the old command and import names."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "frowningdev" }]
dependencies = ["orm-lens==1.16.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mcp = ["orm-lens[mcp]==1.16.0"]
full = ["orm-lens[mcp]==1.16.0"]

[project.urls]
Homepage = "https://github.com/FROWNINGdev/orm-lens"
"New package" = "https://pypi.org/project/orm-lens/"

[project.scripts]
django-orm-lens = "orm_lens.cli:main"
django-orm-lens-mcp = "orm_lens.mcp_server:main"

[tool.setuptools]
packages = ["django_orm_lens"]
